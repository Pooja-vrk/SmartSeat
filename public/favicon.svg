<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C49"/>
      <stop offset="100%" stop-color="#050B1D"/>
    </linearGradient>

    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Neon Road Ribbon Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Violet/Magenta Accent Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Bus Windshield Tint -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- App Icon Canvas / Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1"/>

  <!-- Orbital Glow Ring (Intelligent Connectivity) -->
  <ellipse cx="32" cy="30" rx="22" ry="14" fill="none" stroke="url(#orbitGrad)" stroke-width="1.6" opacity="0.65" stroke-dasharray="24 10" transform="rotate(-18 32 30)"/>

  <!-- Integrated Futuristic Location Pin (Upper Beacon) -->
  <path d="M 32 6 C 22.5 6, 15.5 13.5, 15.5 23 C 15.5 31, 25 41.5, 32 47 C 39 41.5, 48.5 31, 48.5 23 C 48.5 13.5, 41.5 6, 32 6 Z"
        fill="none" stroke="url(#cyanBlue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pin Center Beacon Glow -->
  <circle cx="32" cy="20" r="3" fill="#22D3EE" opacity="0.9"/>

  <!-- Dynamic Sweeping Road (Bottom Route) -->
  <path d="M 10 52 C 20 52, 25 44, 38 41 C 46 39, 52 42, 56 46"
        fill="none" stroke="url(#roadGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 16 54 C 23 54, 27 48, 38 45 C 44 43, 49 46, 52 49"
        fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Futuristic Electric Coach Bus (Front 3/4 View) -->
  <g transform="translate(18, 22)">
    <!-- Bus Main Body (Aerodynamic White Silhouette) -->
    <path d="M 6 2 C 11 1, 20 1.5, 23 4 C 25 5.5, 26 10, 26 17 C 26 18.5, 25 19.5, 23.5 19.5 L 3.5 19.5 C 2 19.5, 1 18.5, 1 16.5 C 1 10, 2 3.5, 6 2 Z"
          fill="#F1F5F9"/>

    <!-- Aerodynamic Roofline Accent (Electric Blue) -->
    <path d="M 6 2 C 11 1, 20 1.5, 23 4"
          fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Large Panoramic Glass Windshield -->
    <path d="M 5 4.5 C 9 3.5, 18 3.8, 21.5 5.8 C 22.8 6.8, 23 9.5, 23 11 C 18 11.2, 8 11, 4 10.5 C 3.8 8, 4 5.5, 5 4.5 Z"
          fill="url(#glassGrad)"/>

    <!-- Cyan LED Light Ribbon / Headlamps -->
    <path d="M 3 13.5 L 8 13.8" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 18 14 L 23 13.5" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Center LED Light Bar -->
    <line x1="10" y1="14" x2="16" y2="14" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>

    <!-- Lower Grill & Bumper -->
    <rect x="7" y="16.5" width="12" height="2" rx="1" fill="#071C49"/>

    <!-- Aerodynamic Side Mirrors -->
    <path d="M 2.5 7 L 0.5 8" stroke="#F1F5F9" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 24 7.5 L 25.5 8.5" stroke="#F1F5F9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Wheels / Chassis Base -->
    <rect x="3.5" y="19" width="4" height="2.5" rx="1" fill="#050B1D"/>
    <rect x="18.5" y="19" width="4" height="2.5" rx="1" fill="#050B1D"/>
  </g>
</svg>